name: Update Strava Data


on:
  schedule:
    - cron: "0 9-22 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-strava:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" 
      - name: Install dependencies
        run: npm ci
      - name: Get token and run fetchStrava.js
        run: |
          response=$(curl -s -X POST https://www.strava.com/api/v3/oauth/token \
            -d client_id=${{ secrets.STRAVA_CLIENT_ID }} \
            -d client_secret=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -d grant_type=refresh_token \
            -d refresh_token=${{ secrets.STRAVA_REFRESH_TOKEN }})
          token=$(echo "$response" | jq -r .access_token)
          echo "::add-mask::$token"
          STRAVA_TOKEN="$token" node fetchStrava.js
        env:
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily Strava update"
          git push

      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow "Update Strava Data" --limit 100 --json databaseId -q ".[7:][].databaseId" |
            xargs -r -n1 gh run delete