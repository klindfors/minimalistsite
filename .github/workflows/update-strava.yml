name: Update Strava Data

on:
  schedule:
    - cron: "0 5 * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-strava:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" 
      - name: Install dependencies
        run: npm install
      - name: Get short-lived access token
        id: get_token
        run: |
          response=$(curl -s -X POST https://www.strava.com/api/v3/oauth/token \
            -d client_id=${{ secrets.STRAVA_CLIENT_ID }} \
            -d client_secret=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -d grant_type=refresh_token \
            -d refresh_token=${{ secrets.STRAVA_REFRESH_TOKEN }})
          echo "Token exchange response: $response"
          token=$(echo $response | jq -r .access_token)
          echo "Extracted token: $token"
          echo "token=$token" >> $GITHUB_OUTPUT
      - name: Run fetchStrava.js
        run: node fetchStrava.js
        env:
          STRAVA_TOKEN: ${{ steps.get_token.outputs.token }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add running/runs.json
          git status
          git commit -m "Daily Strava update" --allow-empty
          git push