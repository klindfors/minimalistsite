name: Update Strava Data

on:
  schedule:
    - cron: "0 5 * * *"  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-strava:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18" 
      - name: Install dependencies
        run: npm install
      - name: Run fetchStrava.js
        run: node fetchStrava.js
        env:
          STRAVA_TOKEN: ${{ secrets.STRAVA_TOKEN }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add runs.json
          git diff --cached --quiet || git commit -m "Daily Strava update"
          git push