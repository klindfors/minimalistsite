<!DOCTYPE html>
<html>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const error = params.get('error');
  
  if (code) {
    //redirecting back to SafeRunner with the authorization code
    window.location.href = 'saferunner://callback' + window.location.search;
  } else {
    document.body.textContent = 'Authentication failed: ' + error;
  }
</script>
<p>Redirecting back to SafeRunner...</p>
</body>
</html>
